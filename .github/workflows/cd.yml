name: CD

# Production deploy on every merge to main. All secrets come from GitHub
# Actions secrets (repo Settings → Secrets and variables → Actions) — nothing
# is hardcoded. Rollback steps: docs/deployment.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  # Never cancel a production deploy mid-flight.
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Deploy frontend → Vercel
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Build (production CMS origin baked in)
        run: npm --prefix frontend run build
        env:
          VITE_CMS_API_URL: ${{ secrets.CMS_API_URL }}

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cd frontend
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-cms:
    name: Deploy CMS → Render (Docker + Postgres)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CMS image
        uses: docker/build-push-action@v6
        with:
          context: ./cms
          file: ./cms/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/cms:${{ github.sha }}
            ghcr.io/${{ github.repository }}/cms:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Render's web service watches the image tag; the Deploy Hook starts the
      # rollout. Strapi applies PostgreSQL schema migrations when the new
      # version boots — that boot is the migration step for this stack.
      - name: Trigger Render deploy
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{}'

      # Post-deploy verification: the CMS must boot the new image against the
      # managed Postgres (i.e. migrations applied) and serve the public API
      # before the workflow reports success. Timeout matches Render's deploy
      # window; a failure here means "check Render logs", not a rollback.
      - name: Wait for deployed CMS health
        env:
          CMS_API_URL: ${{ secrets.CMS_API_URL }}
        run: |
          echo "Waiting for $CMS_API_URL/api/services …"
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "$CMS_API_URL/api/services"; then
              echo "CMS is healthy after deploy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::CMS did not become healthy within 10 minutes of deploy. Check Render logs."
          exit 1
